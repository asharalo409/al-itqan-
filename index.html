<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>আল ইতকান ৪০ | Al-Itqan 40</title>
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#1c0710;--panel:#2c0d19;--line:#4a1c2b;--gold:#e9b44c;--gold2:#f6d58a;--tx:#f5e9d8;--mut:#b99a8a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 'Hind Siliguri',system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
.hero{position:relative;height:230px;background:url(cover.jpg) center 30%/cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(28,7,16,.35),var(--bg))}
.top{position:absolute;z-index:2;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;display:flex;justify-content:space-between;padding:0 12px}
.pill{background:rgba(28,7,16,.75);border:1px solid var(--gold);color:var(--gold2);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:14px;margin-left:6px}
.brand{position:relative;z-index:2;margin:-64px auto 0;text-align:center}
.brand img{width:100px;height:100px;border-radius:50%;border:2px solid var(--gold);object-fit:cover}
h1{margin:4px 0 0;font-size:25px;color:var(--gold2)}.sub{color:var(--mut);font-size:14px;padding:0 16px}
nav{display:flex;overflow-x:auto;padding:12px 12px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--mut);white-space:nowrap;cursor:pointer}
nav button.on{color:var(--gold2);border-color:var(--gold)}
main{max-width:720px;margin:0 auto;padding:16px 14px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meta{color:var(--mut);font-size:13px}b{color:var(--gold2)}
.btn{background:var(--gold);color:#2a0a12;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer}
.ghost{background:none;border:1px solid var(--gold);color:var(--gold2)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;margin:4px 0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.btn{flex:none}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day{color:var(--gold);font-weight:700;margin:14px 0 6px}
.chat{height:55vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.msg{max-width:80%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;word-break:break-word}
.msg.me{align-self:flex-end;background:#5a1a30}.msg small{display:block;color:var(--gold);font-size:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#2a0a12;display:grid;place-items:center;font-weight:700;flex:none;object-fit:cover}
.mem{display:flex;gap:10px;align-items:center}
.tag{background:#5a1a30;border-radius:6px;padding:0 8px;font-size:13px;color:var(--gold2)}
#login{position:fixed;inset:0;z-index:20;background:var(--bg) url(logo.jpg) center 12%/150px no-repeat;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:170px 20px 20px}
#login h2{color:var(--gold2);margin:0}#err{color:#ff9a9a}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#2a0a12;padding:8px 16px;border-radius:20px;font-weight:700;display:none;z-index:30;max-width:90%}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
</style></head><body>
<div id="login" style="display:none"><h2 data-t="title"></h2><p class="sub" data-t="uni"></p>
<input id="em" type="email" placeholder="আপনার জিমেইল / Gmail" style="max-width:280px">
<input id="pw" type="password" placeholder="পাসওয়ার্ড / Password (min 6)" style="max-width:280px">
<div class="row" style="max-width:280px"><button class="btn" onclick="signIn()" data-t="login"></button><button class="btn ghost" onclick="signUp()" data-t="signup"></button></div>
<p id="err"></p><p class="meta" data-t="allow"></p></div>
<div class="hero"><div class="top"><span class="pill" id="role"></span><span><span class="pill" id="bell" onclick="go('notif')"></span><span class="pill" id="lang" onclick="toggleLang()"></span><span class="pill" onclick="sb.auth.signOut().then(()=>location.reload())">⎋</span></span></div></div>
<div class="brand"><img src="logo.jpg" alt="Al-Itqan 40"><h1 data-t="title"></h1><div class="sub" data-t="uni"></div></div>
<nav id="nav"></nav><main id="view"></main><div id="toast"></div>
<script>
const sb=supabase.createClient('https://vfuuyeuglpziitjcwcou.supabase.co','sb_publishable_3q4eW3lP5gEEydTEZEZ1RQ_bix0JGwW');
const T={bn:{title:"আল ইতকান ৪০",uni:"আল কুরআন ও ইসলামিক স্টাডিজ, ইসলামী বিশ্ববিদ্যালয়",login:"লগইন",signup:"নতুন অ্যাকাউন্ট",allow:"নতুন হলে জিমেইল ও পাসওয়ার্ড দিয়ে 'নতুন অ্যাকাউন্ট' চাপুন",denied:"এই জিমেইল অনুমোদিত নয়। অ্যাডমিনের সাথে যোগাযোগ করুন।",notice:"নোটিশ",routine:"রুটিন",files:"ফাইল",chat:"চ্যাট",members:"সদস্য",add:"যোগ করুন",send:"পাঠান",search:"নাম, রোল বা রক্তের গ্রুপ দিয়ে খুঁজুন",msg:"মেসেজ লিখুন...",admin:"অ্যাডমিন",member:"সদস্য",ntitle:"নোটিশের শিরোনাম",time:"সময় লিখুন (যেমন ৯:০০–১০:৩০)",subj:"বিষয়",code:"কোর্স কোড",fname:"ফাইলের নাম (ঐচ্ছিক)",name:"নাম",roll:"রোল",blood:"রক্তের গ্রুপ",phone:"মোবাইল",fb:"ফেসবুক লিংক",addr:"ঠিকানা",save:"প্রোফাইল সেভ করুন",del:"মুছুন",none:"কিছু নেই",tbd:"সময় নির্ধারিত নয়",cls:"টি ক্লাস",mkA:"অ্যাডমিন বানান",mkM:"সদস্য করুন",nNotice:"নতুন নোটিশ: ",nRoutine:"রুটিন আপডেট: ",nFile:"নতুন ফাইল: ",myp:"আমার প্রোফাইল",codeAsk:"ব্যাচের কোড দিন (হোয়াটসঅ্যাপ গ্রুপে পাবেন)",gname:"আপনার পূর্ণ নাম",groll:"রোল",submit:"জমা দিন",wrong:"কোড ভুল",waiting:"অ্যাডমিনের অনুমোদনের অপেক্ষায় আছেন। অনুমোদন হলে ঢুকতে পারবেন।",rejected:"আপনার অনুরোধ বাতিল হয়েছে। অ্যাডমিনের সাথে যোগাযোগ করুন।",again:"আবার দেখুন",out:"লগআউট",batchCode:"ব্যাচের গোপন কোড",pending:"অনুমোদনের অপেক্ষায়",st_new:"কোড দেয়নি",st_pending:"কোড দিয়েছে",st_rejected:"বাতিল",saved:"সেভ হয়েছে",grp:"ব্যাচের সকল সদস্যের গ্রুপ চ্যাট",days:["শনি","রবি","সোম","মঙ্গল","বুধ","বৃহস্পতি","শুক্র"]},
en:{title:"Al-Itqan 40",uni:"Al-Quran & Islamic Studies, Islamic University",login:"Log in",signup:"Create account",allow:"New here? Enter Gmail and password, then press Create account",denied:"This Gmail is not approved. Contact an admin.",notice:"Notices",routine:"Routine",files:"Files",chat:"Chat",members:"Members",add:"Add",send:"Send",search:"Search by name, roll or blood group",msg:"Type a message...",admin:"Admin",member:"Member",ntitle:"Notice title",time:"Type time (e.g. 9:00–10:30)",subj:"Subject",code:"Course code",fname:"File name (optional)",name:"Name",roll:"Roll",blood:"Blood group",phone:"Mobile",fb:"Facebook link",addr:"Address",save:"Save profile",del:"Delete",none:"Nothing here",tbd:"Time not fixed",cls:" classes",mkA:"Make admin",mkM:"Make member",nNotice:"New notice: ",nRoutine:"Routine updated: ",nFile:"New file: ",myp:"My profile",codeAsk:"Enter the batch code (from the WhatsApp group)",gname:"Your full name",groll:"Roll",submit:"Submit",wrong:"Wrong code",waiting:"Waiting for admin approval. You can enter once approved.",rejected:"Your request was rejected. Contact an admin.",again:"Check again",out:"Log out",batchCode:"Batch secret code",pending:"Waiting for approval",st_new:"No code yet",st_pending:"Code entered",st_rejected:"Rejected",saved:"Saved",grp:"Batch group chat",days:["Sat","Sun","Mon","Tue","Wed","Thu","Fri"]}};
let L=localStorage.L||'bn',tab='notice',me=null,RD=0,q='',ph=null,mem=[];
const t=k=>T[L][k],$=s=>document.querySelector(s),isA=()=>me&&me.role=='admin';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dt=d=>new Date(d).toLocaleDateString(L=='bn'?'bn-BD':'en-GB');
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function signIn(){const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?$('#err').textContent=error.message:location.reload()}
async function signUp(){const{error}=await sb.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});error?$('#err').textContent=error.message:location.reload()}
function toggleLang(){L=L=='bn'?'en':'bn';localStorage.L=L;render()}
function go(x){tab=x;render()}
async function start(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session){$('#login').style.display='flex';if(/error/.test(location.hash+location.search))$('#err').textContent=t('denied');chrome();return}
 const{data:p}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(!p){await sb.auth.signOut();location.reload();return}
 if(p.status!='approved'){me=p;return gate()}
 me=p;
 sb.channel('rt').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},x=>{if(tab=='chat')addMsg(x.new)})
  .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},x=>{toast('🔔 '+x.new.text);if(['notice','routine','files','notif'].includes(tab))render();bell()}).subscribe();
 render();
}
function gate(){const s=me.status,l=$('#login');l.style.display='flex';
 l.innerHTML=`<h2>${t('title')}</h2><p class="sub">${esc(me.email)}</p>`+(s=='new'?`<p>${t('codeAsk')}</p><input id="gn" placeholder="${t('gname')}" style="max-width:280px"><input id="gr" placeholder="${t('groll')}" style="max-width:280px"><input id="bc" style="max-width:280px;text-align:center"><button class="btn" onclick="claim()">${t('submit')}</button>`:`<p>${t(s=='rejected'?'rejected':'waiting')}</p><button class="btn" onclick="location.reload()">${t('again')}</button>`)+`<p id="err"></p><button class="btn ghost" onclick="sb.auth.signOut().then(()=>location.reload())">${t('out')}</button>`}
async function claim(){const{data}=await sb.rpc('claim_code',{c:$('#bc').value.trim(),n:$('#gn').value.trim(),r:$('#gr').value.trim()});if(data){me.status='pending';gate()}else $('#err').textContent=t('wrong')}
async function setS(id,s){await sb.rpc('set_status',{uid:id,s});render()}
async function setR(id,r){await sb.rpc('set_role',{uid:id,r});render()}
async function saveCode(){const{error}=await sb.from('settings').update({value:$('#bcode').value.trim()}).eq('key','batch_code');toast(error?error.message:t('saved'))}
async function bell(){const{count}=await sb.from('notifications').select('*',{count:'exact',head:true}).gt('created_at',localStorage.seen||'1970-01-01');$('#bell').textContent='🔔'+(count&&tab!='notif'?' '+count:'')}
function chrome(){document.documentElement.lang=L;$('#lang').textContent=L=='bn'?'EN':'বাংলা';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
 if(me){$('#role').textContent=isA()?t('admin'):t('member');$('#nav').innerHTML=['notice','routine','files','chat','members'].map(k=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${t(k)}</button>`).join('')}}
async function add(tbl,row,txt){const{error}=await sb.from(tbl).insert(row);if(error)return toast(error.message);await sb.from('notifications').insert({kind:tbl,text:txt});render()}
async function del(tbl,id,path){if(!confirm('?'))return;if(path)await sb.storage.from('files').remove([path]);await sb.from(tbl).delete().eq('id',id);render()}
const dB=(tbl,id,p)=>isA()?`<button class="btn ghost" onclick="del('${tbl}',${id},${p?`'${p}'`:'null'})">${t('del')}</button>`:'';
const av=m=>m.photo?`<img class="av" src="${m.photo}" alt="">`:`<div class="av">${esc((m.name||'?')[0])}</div>`;
async function render(){
 chrome();let h='';
 if(tab=='notice'){const{data}=await sb.from('notices').select('*').order('created_at',{ascending:false});
  h=(isA()?`<div class="card"><input id="a1" placeholder="${t('ntitle')}"><button class="btn" onclick="a1.value&&add('notices',{title:a1.value},t('nNotice')+a1.value)">${t('add')}</button></div>`:'')+(data||[]).map(n=>`<div class="card bar"><div><b>${esc(n.title)}</b><div class="meta">${dt(n.created_at)}</div></div>${dB('notices',n.id)}</div>`).join('')}
 else if(tab=='routine'){const{data}=await sb.from('routine').select('*').order('id');const d=data||[];
  h=isA()?`<div class="card"><select id="r0" onchange="RD=+this.value">${t('days').map((x,i)=>`<option value="${i}" ${i==RD?'selected':''}>${x}</option>`).join('')}</select><div class="row"><input id="r3" placeholder="${t('code')}"><input id="r2" placeholder="${t('subj')}"></div><input id="r1" placeholder="${t('time')}"><button class="btn" onclick="RD=+r0.value;add('routine',{day:RD,code:r3.value,subject:r2.value,time:r1.value.trim()},t('nRoutine')+(r3.value||r2.value))">${t('add')}</button></div>`:'';
  t('days').forEach((n,i)=>{const it=d.filter(x=>x.day==i);if(it.length)h+=`<div class="day">${n} <span class="meta">(${it.length}${t('cls')})</span></div>`+it.map(r=>`<div class="card bar"><span><span class="tag">${esc(r.code||'—')}</span> <b>${esc(r.subject)}</b><div class="meta">${r.time?esc(r.time):t('tbd')}</div></span>${dB('routine',r.id)}</div>`).join('')})}
 else if(tab=='files'){const{data}=await sb.from('files').select('*').order('created_at',{ascending:false});
  h=(isA()?`<div class="card"><input id="f1" placeholder="${t('fname')}"><input id="ff" type="file" accept=".pdf,image/*"><button class="btn" onclick="up()">${t('add')}</button></div>`:'')+(data||[]).map(f=>`<div class="card bar"><a href="${esc(f.url)}" target="_blank" rel="noopener" style="color:var(--gold2)">📄 ${esc(f.name)}</a>${dB('files',f.id,f.path)}</div>`).join('')}
 else if(tab=='chat'){const{data}=await sb.from('messages').select('*').order('id',{ascending:false}).limit(100);
  h=`<div class="meta">👥 ${t('grp')}</div><div class="chat" id="ch">${(data||[]).reverse().map(msgH).join('')}</div><div class="row" style="margin-top:8px"><input id="cm" placeholder="${t('msg')}" onkeydown="if(event.key=='Enter')sendM()"><button class="btn" onclick="sendM()">${t('send')}</button></div>`;$('#view').innerHTML=h;const c=$('#ch');c.scrollTop=c.scrollHeight;return bell()}
 else if(tab=='notif'){const{data}=await sb.from('notifications').select('*').order('created_at',{ascending:false}).limit(50);localStorage.seen=new Date().toISOString();h=(data||[]).map(n=>`<div class="card">🔔 ${esc(n.text)}<div class="meta">${dt(n.created_at)}</div></div>`).join('')}
 else if(tab=='members'){const{data}=await sb.from('profiles').select('*').order('roll');mem=(data||[]).filter(m=>m.status=='approved');const pend=(data||[]).filter(m=>m.status!='approved');const{data:cs}=isA()?await sb.from('settings').select('value').eq('key','batch_code').single():{};
  h=`<div class="card"><b>${t('myp')}</b><div class="row" style="margin:6px 0">${av(me)}<input type="file" accept="image/*" onchange="pic(this)"></div>${['name','roll','blood','phone','fb','addr'].map(k=>`<input id="p_${k}" placeholder="${t(k)}" value="${esc(me[k])}">`).join('')}<button class="btn" onclick="saveP()">${t('save')}</button></div>`
  +(isA()?`<div class="card"><b>${t('batchCode')}</b><div class="row"><input id="bcode" value="${esc(cs&&cs.value)}"><button class="btn" onclick="saveCode()">${t('save')}</button></div></div>`+(pend.length?`<div class="card"><b>${t('pending')} (${pend.length})</b>${pend.map(m=>`<div class="row" style="margin:6px 0"><span>${esc(m.name)} ${m.roll?'· '+esc(m.roll):''}<div class="meta">${esc(m.email)} · ${t('st_'+m.status)}</div></span><button class="btn" onclick="setS('${m.id}','approved')">✔</button><button class="btn ghost" onclick="setS('${m.id}','rejected')">✕</button></div>`).join('')}</div>`:''):'')
  +`<input id="sq" placeholder="🔍 ${t('search')}" oninput="q=this.value;$('#ml').innerHTML=list()"><div id="ml">${list()}</div>`}
 $('#view').innerHTML=h;bell()}
const list=()=>{const s=q.toLowerCase(),l=mem.filter(m=>[m.name,m.roll,m.blood].join(' ').toLowerCase().includes(s));return l.length?l.map(m=>`<div class="card mem">${av(m)}<div><b>${esc(m.name)}</b> ${m.roll?`<span class="tag">${t('roll')} ${esc(m.roll)}</span>`:''} ${m.blood?`<span class="tag">🩸 ${esc(m.blood)}</span>`:''}<div class="meta">${esc(m.phone||'')} ${m.addr?'· '+esc(m.addr):''} ${m.fb?`· <a style="color:var(--gold2)" target="_blank" rel="noopener" href="${esc(/^http/.test(m.fb)?m.fb:'https://'+m.fb)}">FB</a>`:''}</div>${isA()&&m.id!=me.id?`<button class="btn ghost" style="margin-top:4px;padding:2px 10px" onclick="setR('${m.id}','${m.role=='admin'?'member':'admin'}')">${t(m.role=='admin'?'mkM':'mkA')}</button>`:''}</div></div>`).join(''):`<p class="meta">${t('none')}</p>`};
const msgH=m=>`<div class="msg ${m.user_id==me.id?'me':''}"><small>${esc(m.name)}</small>${esc(m.body)}</div>`;
function addMsg(m){const c=$('#ch');c.insertAdjacentHTML('beforeend',msgH(m));c.scrollTop=c.scrollHeight}
async function sendM(){const v=$('#cm').value.trim();if(!v)return;$('#cm').value='';const{error}=await sb.from('messages').insert({name:me.name,body:v});if(error)toast(error.message)}
async function up(){const f=$('#ff').files[0];if(!f)return;const nm=$('#f1').value||f.name,path=Date.now()+'.'+f.name.split('.').pop();
 const{error}=await sb.storage.from('files').upload(path,f);if(error)return toast(error.message);
 await add('files',{name:nm,url:sb.storage.from('files').getPublicUrl(path).data.publicUrl,path},t('nFile')+nm)}
function pic(i){const f=i.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;const s=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,200,200);ph=c.toDataURL('image/jpeg',.7);toast('✔')};im.src=URL.createObjectURL(f)}
async function saveP(){const r={};['name','roll','blood','phone','fb','addr'].forEach(k=>r[k]=$('#p_'+k).value.trim());if(ph)r.photo=ph;
 const{error}=await sb.from('profiles').update(r).eq('id',me.id);if(error)return toast(error.message);Object.assign(me,r);toast(t('saved'));render()}
start();
</script></body></html>
